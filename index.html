<meta charset="utf-8">
<title>Allen Sample Brain</title>
<meta name="description" content="Allen Human Brain Atlas microarray sample locations on an MNI cortex, cerebellum and brainstem">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0c1015;
    --panel: #141a21;
    --line: #26303b;
    --ink: #e6eaef;
    --muted: #8b96a3;
    --accent: #7fb7d9;
    --cx: #ff7a59;
    --cb: #58d0f0;
    --bs: #f3cf55;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
    width: 264px; max-width: calc(100vw - 32px); max-height: calc(100% - 32px); overflow-y: auto;
    background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { flex: 1; cursor: pointer; }
  .count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .mesh-swatch { border-radius: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button, .views button {
    font: 500 12px var(--sans); color: var(--muted); background: transparent; border: 0; padding: 6px 0; cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--line); color: var(--ink); }
  .views { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .views button { border: 1px solid var(--line); border-radius: 5px; font-family: var(--mono); }
  button:hover { color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #legend { display: flex; flex-direction: column; gap: 4px; }

  #readout {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: min(360px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    pointer-events: none;
  }
  #readout .name { font-weight: 500; }
  #readout .meta { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
  .hint { font-size: 12px; color: var(--muted); }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font: 13px var(--mono); }

  @media (max-width: 600px) {
    .panel { width: auto; right: 16px; max-height: 45%; }
  }
</style>

<div id="stage"></div>

<aside class="panel">
  <div>
    <h1>Allen Human Brain Atlas samples</h1>
    <p class="sub" id="summary">Loading…</p>
  </div>

  <div class="group">
    <span class="label">Brain surface</span>
    <div class="row"><span class="swatch mesh-swatch" style="background:#8fc4ff"></span><input type="checkbox" id="show-brain" checked><label for="show-brain">Cortex, cerebellum and brainstem</label></div>
    <div class="row"><span class="swatch mesh-swatch" style="background:transparent"></span><input type="checkbox" id="mirror"><label for="mirror">Mirror right hemisphere onto the left</label></div>
    <label class="label" for="opacity">Surface opacity</label>
    <input type="range" id="opacity" min="0" max="0.6" step="0.01" value="0.06">
    <div class="row"><span class="swatch mesh-swatch" style="background:transparent"></span><input type="checkbox" id="axial-cut"><label for="axial-cut">Axial cut</label></div>
    <div class="group" id="cut-controls" hidden>
      <label class="label" for="cut-z">Cut height <span class="count" id="cut-z-value"></span></label>
      <input type="range" id="cut-z" min="-70" max="85" step="1" value="20">
      <div class="row"><input type="checkbox" id="cut-band"><label for="cut-band">Only samples within ±5 mm of the cut</label></div>
    </div>

    <span class="label">Donors</span>

  </div>
</aside>

<script src="assets/bundle.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// MNI (x = right, y = anterior, z = superior) -> three.js (y up)
const toScene = (x, y, z) => [x, z, -y];

const BRAIN_COLOR = 0x8fc4ff;

const statusEl = document.getElementById("status");

// ---------------------------------------------------------------- loading
// assets/bundle.js (from make_bundle.sh) embeds every file, so the page also works from file://
async function fetchRaw(url) {
  const packed = window.BRAIN_BUNDLE?.[url];
  if (packed) return Uint8Array.from(atob(packed), c => c.charCodeAt(0));
  const res = await fetch(url).catch(() => { throw new Error(`Could not load ${url}. Run make_bundle.sh or serve the folder over HTTP.`); });
  if (!res.ok) throw new Error(`Could not load ${url} (${res.status})`);
  return new Uint8Array(await res.arrayBuffer());
}

async function fetchBytes(url) {
  let buf = await fetchRaw(url);
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    buf = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return buf;
}

function parseNifti(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const le = dv.getInt32(0, true) === 348;
  const i16 = o => dv.getInt16(o, le), f32 = o => dv.getFloat32(o, le);
  const dims = [i16(42), i16(44), i16(46)];
  const datatype = i16(70), voxOffset = Math.round(f32(108));
  const srow = [280, 296, 312].map(o => [0, 1, 2, 3].map(k => f32(o + 4 * k)));
  const n = dims[0] * dims[1] * dims[2];
  const data = new Float32Array(n);
  const readers = { 2: [1, o => dv.getUint8(o)], 4: [2, o => dv.getInt16(o, le)], 8: [4, o => dv.getInt32(o, le)],
                    16: [4, o => dv.getFloat32(o, le)], 512: [2, o => dv.getUint16(o, le)] };
  if (!readers[datatype]) throw new Error(`Unsupported NIfTI datatype ${datatype}`);
  const [size, read] = readers[datatype];
  for (let i = 0; i < n; i++) data[i] = read(voxOffset + i * size);
  return { dims, srow, data };
}

// ---------------------------------------------------------------- volume -> surface
// Brain surface straight from the MNI152 T1 (the same volume as the axial slice), so the
// 3D brain and the slice line up exactly. The volume is averaged over `step`^3 blocks to
// keep the mesh light, box-blurred once, then meshed with surface nets at intensity `iso`.
function volumeSurface(vol, iso, step = 2) {
  const [nx, ny, nz] = vol.dims, pad = 1;
  const d = [nx, ny, nz].map(n => Math.floor(n / step) + 2 * pad);
  const [dx, dy, dz] = d, field = new Float32Array(dx * dy * dz);
  for (let z = 0; z < dz - 2 * pad; z++) for (let y = 0; y < dy - 2 * pad; y++) for (let x = 0; x < dx - 2 * pad; x++) {
    let sum = 0;
    for (let c = 0; c < step ** 3; c++) {
      const X = x * step + (c % step), Y = y * step + (Math.floor(c / step) % step), Z = z * step + Math.floor(c / step / step);
      sum += vol.data[X + nx * (Y + ny * Z)];
    }
    field[(x + pad) + dx * ((y + pad) + dy * (z + pad))] = sum / step ** 3;
  }
  for (let axis = 0; axis < 3; axis++) boxBlur(field, d, axis);

  const { positions, indices } = surfaceNets(field, d, iso);
  const s = vol.srow, half = (step - 1) / 2;
  for (let i = 0; i < positions.length; i += 3) {
    // field cell -> original voxel index (block centre) -> MNI mm
    const [x, y, z] = [0, 1, 2].map(a => (positions[i + a] - pad) * step + half);
    const mni = s.map(r => r[0] * x + r[1] * y + r[2] * z + r[3]);
    [positions[i], positions[i + 1], positions[i + 2]] = toScene(...mni);
  }
  return { positions, indices };
}

function boxBlur(field, [dx, dy, dz], axis) {
  const stride = [1, dx, dx * dy][axis], len = [dx, dy, dz][axis];
  const copy = field.slice();
  for (let i = 0; i < field.length; i++) {
    const c = [i % dx, Math.floor(i / dx) % dy, Math.floor(i / (dx * dy))][axis];
    let sum = copy[i], k = 1;
    if (c > 0) { sum += copy[i - stride]; k++; }
    if (c < len - 1) { sum += copy[i + stride]; k++; }
    field[i] = sum / k;
  }
}

function surfaceNets(field, [dx, dy, dz], iso) {
  const at = (x, y, z) => field[x + dx * (y + dy * z)];
  const cellVert = new Int32Array(dx * dy * dz).fill(-1);
  const positions = [], indices = [];
  const corners = [...Array(8)].map((_, c) => [c & 1, (c >> 1) & 1, (c >> 2) & 1]);
  const edges = [];
  for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) {
    const diff = corners[a].reduce((s, v, i) => s + Math.abs(v - corners[b][i]), 0);
    if (diff === 1) edges.push([a, b]);
  }
  const v = new Float32Array(8);
  for (let z = 0; z < dz - 1; z++) for (let y = 0; y < dy - 1; y++) for (let x = 0; x < dx - 1; x++) {
    let inside = 0;
    for (let c = 0; c < 8; c++) { v[c] = at(x + corners[c][0], y + corners[c][1], z + corners[c][2]); if (v[c] > iso) inside++; }
    if (inside === 0 || inside === 8) continue;
    let px = 0, py = 0, pz = 0, n = 0;
    for (const [a, b] of edges) {
      if ((v[a] > iso) === (v[b] > iso)) continue;
      const t = (iso - v[a]) / (v[b] - v[a]);
      px += corners[a][0] + t * (corners[b][0] - corners[a][0]);
      py += corners[a][1] + t * (corners[b][1] - corners[a][1]);
      pz += corners[a][2] + t * (corners[b][2] - corners[a][2]);
      n++;
    }
    cellVert[x + dx * (y + dy * z)] = positions.length / 3;
    positions.push(x + px / n, y + py / n, z + pz / n);
  }
  const cell = (x, y, z) => cellVert[x + dx * (y + dy * z)];
  for (let z = 1; z < dz - 1; z++) for (let y = 1; y < dy - 1; y++) for (let x = 1; x < dx - 1; x++) {
    const here = at(x, y, z) > iso;
    // edge along x: shared by cells with min corner (x, y-1..y, z-1..z)
    if (here !== (at(x + 1, y, z) > iso)) quad(cell(x, y - 1, z - 1), cell(x, y, z - 1), cell(x, y, z), cell(x, y - 1, z), here);
    if (here !== (at(x, y + 1, z) > iso)) quad(cell(x - 1, y, z - 1), cell(x - 1, y, z), cell(x, y, z), cell(x, y, z - 1), here);
    if (here !== (at(x, y, z + 1) > iso)) quad(cell(x - 1, y - 1, z), cell(x, y - 1, z), cell(x, y, z), cell(x - 1, y, z), here);
  }
  // `inside` = the edge starts inside the surface; winding is chosen so faces (and the
  // normals three.js derives from them) point outward, away from the inside.
  function quad(a, b, c, d, inside) {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    if (inside) indices.push(a, b, c, a, c, d); else indices.push(a, d, c, a, c, b);
  }
  return { positions: new Float32Array(positions), indices };
}

// ---------------------------------------------------------------- sample file
function parseCsvLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

// SampleAnnot_all.csv: one header row, one row per sample, donor in the donor_id column
function parseSamples(text) {
  const [headerLine, ...lines] = text.split(/\r?\n/).filter(l => l.trim());
  const header = parseCsvLine(headerLine.trim());
  const samples = [];
  for (const line of lines) {
    const cols = parseCsvLine(line.trim());
    const r = Object.fromEntries(header.map((h, i) => [h, cols[i]]));
    const x = +r.mni_x, y = +r.mni_y, z = +r.mni_z;
    if ([x, y, z].some(Number.isNaN)) continue;
    samples.push({ donor: r.donor_id, slab: r.slab_type, acronym: r.structure_acronym, name: r.structure_name, mni: [x, y, z] });
  }
  return samples;
}

// ---------------------------------------------------------------- scene
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0c1015);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;
controls.target.set(0, 5, 15);

scene.add(new THREE.HemisphereLight(0xf2f4f7, 0x2a3038, 1.4));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
camera.add(keyLight); keyLight.position.set(0.4, 0.6, 1);
scene.add(camera);

// Each surface is drawn twice: a depth-only pass so only its outer shell shows,
// then a translucent colour pass. Samples draw last with no depth test, on top.
const surfaces = {};

// Axial cut: everything above the plane (scene y = MNI z) is clipped away.
// The normal points down, so what is kept is y <= constant; a huge constant means "no cut".
const NO_CUT = 1e5;
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), NO_CUT);
// Sample clouds have their own pair of planes: normally just the cut (top), but with the
// ±5 mm band option they keep only cut - 5 <= y <= cut + 5.
const BAND_MM = 5;
const pointTop = new THREE.Plane(new THREE.Vector3(0, -1, 0), NO_CUT);     // keeps y <= constant
const pointBottom = new THREE.Plane(new THREE.Vector3(0, 1, 0), NO_CUT);   // keeps y >= -constant
renderer.localClippingEnabled = true;

// Glass look: nearly clear where the surface faces the viewer, brighter blue at
// grazing angles (Fresnel rim), plus a soft specular highlight from the camera.
function glassMaterial(color) {
  return new THREE.ShaderMaterial({
    uniforms: { tint: { value: new THREE.Color(color) }, opacity: { value: +document.getElementById("opacity").value } },
    vertexShader: `
      #include <clipping_planes_pars_vertex>
      varying vec3 vNormal; varying vec3 vView;
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-mvPosition.xyz);
        gl_Position = projectionMatrix * mvPosition;
        #include <clipping_planes_vertex>
      }`,
    fragmentShader: `
      #include <clipping_planes_pars_fragment>
      uniform vec3 tint; uniform float opacity;
      varying vec3 vNormal; varying vec3 vView;
      void main() {
        #include <clipping_planes_fragment>
        vec3 n = normalize(vNormal);
        float facing = abs(dot(n, vView));
        float rim = pow(1.0 - facing, 2.5);
        float spec = pow(max(dot(n, normalize(vView + vec3(0.35, 0.5, 0.0))), 0.0), 40.0);
        vec3 col = tint * (0.55 + 0.9 * rim) + vec3(spec * 0.8);
        gl_FragColor = vec4(col, clamp(opacity + rim * 0.55 + spec * 0.4, 0.0, 1.0));
      }`,
    transparent: true, depthWrite: false, depthFunc: THREE.LessEqualDepth, side: THREE.FrontSide,
    clipping: true, clippingPlanes: [cutPlane],
  });
}
function addSurface(key, positions, indices, color) {
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geom.setIndex(new THREE.BufferAttribute(indices instanceof Uint32Array ? indices : new Uint32Array(indices), 1));
  geom.computeVertexNormals();
  const depth = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ colorWrite: false, clippingPlanes: [cutPlane] }));
  depth.renderOrder = 0;
  const shade = new THREE.Mesh(geom, glassMaterial(color));
  shade.renderOrder = 1;
  const group = new THREE.Group(); group.add(depth, shade);
  scene.add(group);
  (surfaces[key] ??= []).push({ group, shade });
}

// Round point sprite
const dot = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.beginPath(); g.arc(32, 32, 28, 0, Math.PI * 2); g.fill();
  g.lineWidth = 5; g.strokeStyle = "rgba(0,0,0,0.55)"; g.stroke();
  return new THREE.CanvasTexture(c);
})();

// One point cloud per donor so each can be switched off; every sample is the same green.
const SAMPLE_COLOR = 0x4ade80, HOVER_COLOR = 0xffffff, SELECT_COLOR = 0xffb020;
let samples = [], donorClouds = [], pointSize = 2.2;

// Mirror mode: right-hemisphere samples (mni_x > 0) are drawn at -x, on the left
let mirrored = false;
const shownMni = s => (mirrored && s.mni[0] > 0 ? [-s.mni[0], s.mni[1], s.mni[2]] : s.mni);

function pointsFrom(list, color, size) {
  const pos = new Float32Array(list.length * 3);
  list.forEach((s, i) => pos.set(toScene(...shownMni(s)), i * 3));
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const cloud = new THREE.Points(geom, new THREE.PointsMaterial({
    size, color, map: dot, alphaTest: 0.5, transparent: true, depthTest: false, depthWrite: false,
    clippingPlanes: [pointTop, pointBottom],
  }));
  cloud.renderOrder = 2;
  return cloud;
}

// Single-point markers drawn over the cloud for the hovered and the clicked sample
function makeMarker(color) {
  const m = pointsFrom([{ mni: [0, 0, 0] }], color, pointSize * 3.2);
  m.renderOrder = 3; m.visible = false; m.frustumCulled = false; scene.add(m);
  m.material.clippingPlanes = null;   // a selected sample stays marked even when cut away
  return m;
}
const hoverMarker = makeMarker(HOVER_COLOR), selectMarker = makeMarker(SELECT_COLOR);
function placeMarker(marker, s) {
  marker.visible = !!s;
  if (s) { marker.geometry.getAttribute("position").set(toScene(...shownMni(s))); marker.geometry.getAttribute("position").needsUpdate = true; }
}

function addSamples(list) {
  samples = list;
  const byDonor = new Map();
  for (const s of list) (byDonor.get(s.donor) ?? byDonor.set(s.donor, []).get(s.donor)).push(s);
  donorClouds = [...byDonor].map(([donor, items]) => {
    const cloud = pointsFrom(items, SAMPLE_COLOR, pointSize);
    cloud.userData = { donor, items };
    scene.add(cloud);
    return cloud;
  });
  document.getElementById("legend").innerHTML = donorClouds.map((c, i) =>
    `<div class="row"><input type="checkbox" id="donor-${i}" checked><label for="donor-${i}">Donor ${c.userData.donor}</label><span class="count">${c.userData.items.length}</span></div>`
  ).join("");
  donorClouds.forEach((cloud, i) => document.getElementById(`donor-${i}`).addEventListener("change", e => {
    cloud.visible = e.target.checked;
    if (hovered?.donor === cloud.userData.donor) setHovered(null);   // the selection is kept
  }));
}

const donors = () => donorClouds.map(c => c.userData.donor);

// ---------------------------------------------------------------- views & UI
const VIEWS = { L: [-1, 0, 0], R: [1, 0, 0], A: [0, 0, -1], P: [0, 0, 1], S: [0, 1, 0], I: [0, -1, 0] };
function setView(dir, dist = 420) {
  const [x, y, z] = dir, t = controls.target;
  camera.up.set(0, 1, 0);
  if (Math.abs(y) === 1) camera.up.set(0, 0, -1);   // superior/inferior: anterior at top
  camera.position.set(t.x + x * dist, t.y + y * dist, t.z + z * dist);
  camera.lookAt(t); controls.update();
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(VIEWS[b.dataset.view])));

document.getElementById("show-brain").addEventListener("change", e => (surfaces.brain ?? []).forEach(s => (s.group.visible = e.target.checked)));

document.getElementById("mirror").addEventListener("change", e => {
  mirrored = e.target.checked;
  for (const cloud of donorClouds) {
    const attr = cloud.geometry.getAttribute("position");
    cloud.userData.items.forEach((s, i) => attr.setXYZ(i, ...toScene(...shownMni(s))));
    attr.needsUpdate = true;
    cloud.geometry.computeBoundingSphere();
  }
  placeMarker(selectMarker, selected);
  placeMarker(hoverMarker, hovered && hovered !== selected ? hovered : null);
  showReadout();
});
document.getElementById("opacity").addEventListener("input", e => {
  Object.values(surfaces).flat().forEach(s => (s.shade.material.uniforms.opacity.value = +e.target.value));
});
document.getElementById("point-size").addEventListener("input", e => {
  pointSize = +e.target.value;
  donorClouds.forEach(c => (c.material.size = pointSize));
  hoverMarker.material.size = selectMarker.material.size = pointSize * 3.2;
});

// Hover highlights a sample; click pins it (click empty space to clear)
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
const readout = document.getElementById("readout");
let hovered = null, selected = null;

function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.params.Points.threshold = pointSize * 0.6;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(donorClouds.filter(c => c.visible))
    .find(h => sampleShown(shownMni(h.object.userData.items[h.index])[2]));   // ignore samples cut away
  return hit ? hit.object.userData.items[hit.index] : null;
}

function showReadout() {
  const s = selected ?? hovered;
  if (!s) {
    readout.innerHTML = `<div class="name">Hover or click a sample</div><div class="meta">MNI x, y, z (mm)</div>`;
    return;
  }
  readout.innerHTML = `<div class="name"></div><div class="meta"></div>`;
  readout.querySelector(".name").textContent = `${selected ? "Selected: " : ""}${s.name} (${s.acronym})`;
  readout.querySelector(".meta").textContent = `Donor ${s.donor} · ${s.slab} · MNI ${s.mni.map(v => v.toFixed(0)).join(", ")}${mirrored && s.mni[0] > 0 ? " (drawn mirrored)" : ""}`;
}
function setHovered(s) { hovered = s; placeMarker(hoverMarker, s && s !== selected ? s : null); showReadout(); }
function setSelected(s) { selected = s; placeMarker(selectMarker, s); placeMarker(hoverMarker, null); showReadout(); }

renderer.domElement.addEventListener("pointermove", e => { if (samples.length) setHovered(pick(e)); });
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;   // a drag, not a click
  setSelected(pick(e));
});

// ---------------------------------------------------------------- axial cut + T1 slice
// The MNI152 T1 is resampled at the cut height into a flat textured quad lying at the cut.
let t1 = null, sliceMesh = null, sliceTexture = null;
// Intensity window for the slice (set from brain-voxel percentiles in setupSlice):
// below t1Lo is black, above t1Hi is white; t1Bg separates the head from the background.
let t1Lo = 0, t1Hi = 1, t1Bg = 0;
const percentile = (sorted, q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))];
const cutToggle = document.getElementById("axial-cut"), cutSlider = document.getElementById("cut-z");
const bandToggle = document.getElementById("cut-band");
const cutZ = () => (cutToggle.checked ? +cutSlider.value : NO_CUT);
const bandOn = () => cutToggle.checked && bandToggle.checked;
// Whether a sample at MNI height z is currently drawn (same rule as pointTop/pointBottom)
const sampleShown = z => (bandOn() ? Math.abs(z - cutZ()) <= BAND_MM : z <= cutZ());

function setupSlice(vol) {
  t1 = vol;
  const [nx, ny] = vol.dims, s = vol.srow;
  // Contrast window from non-zero voxels (sampled): the 30th percentile sits around grey
  // matter/CSF, so stretching 30th..99.5th spreads grey vs white matter over the full range
  const vals = [];
  for (let i = 0; i < vol.data.length; i += 53) if (vol.data[i] > 0) vals.push(vol.data[i]);
  vals.sort((a, b) => a - b);
  t1Lo = percentile(vals, 0.30);
  t1Hi = percentile(vals, 0.995);
  t1Bg = percentile(vals, 0.02);

  sliceTexture = new THREE.DataTexture(new Uint8Array(nx * ny * 4), nx, ny, THREE.RGBAFormat);
  sliceTexture.magFilter = sliceTexture.minFilter = THREE.LinearFilter;
  // Quad corners at the voxel-grid edges (i, j = -0.5 .. n - 0.5); z is set per cut via position.y
  const corner = (i, j) => { const x = s[0][0] * i + s[0][1] * j + s[0][3], y = s[1][0] * i + s[1][1] * j + s[1][3]; return toScene(x, y, 0); };
  const c = [corner(-0.5, -0.5), corner(nx - 0.5, -0.5), corner(nx - 0.5, ny - 0.5), corner(-0.5, ny - 0.5)];
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(c.flat()), 3));
  geom.setAttribute("uv", new THREE.BufferAttribute(new Float32Array([0, 0, 1, 0, 1, 1, 0, 1]), 2));
  geom.setIndex([0, 1, 2, 0, 2, 3]);
  sliceMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ map: sliceTexture, side: THREE.DoubleSide, transparent: true, alphaTest: 0.05 }));
  sliceMesh.visible = false;
  scene.add(sliceMesh);
}

function updateCut() {
  const on = cutToggle.checked, z = +cutSlider.value;
  document.getElementById("cut-controls").hidden = !on;
  document.getElementById("cut-z-value").textContent = `z = ${z} mm`;
  cutPlane.constant = on ? z : NO_CUT;
  pointTop.constant = !on ? NO_CUT : bandOn() ? z + BAND_MM : z;
  pointBottom.constant = bandOn() ? -(z - BAND_MM) : NO_CUT;
  // Hover follows what is drawn; a selected sample stays selected even if it is cut away
  if (hovered && !sampleShown(shownMni(hovered)[2])) setHovered(null);
  if (!t1 || !sliceMesh) return;
  sliceMesh.visible = on;
  if (!on) return;
  // Linear interpolation between the two voxel slices around this z (axis-aligned affine)
  const [nx, ny, nz] = t1.dims, s = t1.srow;
  const k = Math.min(nz - 1, Math.max(0, (z - s[2][3]) / s[2][2]));
  const k0 = Math.floor(k), k1 = Math.min(nz - 1, k0 + 1), f = k - k0;
  const px = sliceTexture.image.data, plane = nx * ny;
  for (let p = 0; p < plane; p++) {
    const v = t1.data[k0 * plane + p] * (1 - f) + t1.data[k1 * plane + p] * f;
    const g = 255 * Math.min(1, Math.max(0, (v - t1Lo) / (t1Hi - t1Lo)));
    px[p * 4] = px[p * 4 + 1] = px[p * 4 + 2] = g;
    px[p * 4 + 3] = v > t1Bg ? 255 : 0;   // background outside the brain is transparent
  }
  sliceTexture.needsUpdate = true;
  sliceMesh.position.y = z + 0.05;   // a hair above the cut so the clipped surface does not cover it
}
cutToggle.addEventListener("change", updateCut);
cutSlider.addEventListener("input", updateCut);
bandToggle.addEventListener("change", updateCut);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
setView([-0.62, 0.35, -0.7].map(v => v / Math.hypot(-0.62, 0.35, -0.7)));
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Handle for inspecting the scene from the browser console
window.viewer = { THREE, scene, camera, controls, setView, toScene, get samples() { return samples; } };

// ---------------------------------------------------------------- go
try {
  const [t1Bytes, sampleText] = await Promise.all([
    fetchBytes("assets/mni152.nii.gz"),
    fetchRaw("SampleAnnot_all.csv").then(b => new TextDecoder().decode(b)),
  ]);
  statusEl.textContent = "Building brain surface…";
  await new Promise(r => setTimeout(r, 30));
  const t1Volume = parseNifti(t1Bytes);
  setupSlice(t1Volume);
  const brain = volumeSurface(t1Volume, t1Lo);
  addSurface("brain", brain.positions, brain.indices, BRAIN_COLOR);
  const list = parseSamples(sampleText);
  addSamples(list);
  updateCut();
  document.getElementById("summary").textContent = `${list.length.toLocaleString()} samples from ${donors().length} donors, in MNI space`;
  statusEl.hidden = true;
} catch (err) {
  statusEl.textContent = err.message;
  console.error(err);
}
</script>
